name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check appliance and build scripts
        run: |
          shellcheck -x build/build-appliance.sh
          find appliance/rootfs/usr/local/sbin -type f -print0 | xargs -0 shellcheck
          # OpenRC service variables are consumed by openrc-run, not this file.
          find appliance/rootfs/etc/init.d -type f -print0 | xargs -0 shellcheck -s sh -e SC2034
      - name: Check final appliance defaults
        run: |
          test -f SETUP.cmd
          grep -F 'pstv-bridge' build/build-appliance.sh
          grep -F -- '--pcm-buffer-time=30000 --pcm-period-time=10000' appliance/rootfs/etc/init.d/bluealsa-aplay
          grep -F 'sound.bufferTime = "10"' appliance/PSTV-Bluetooth-Audio-Bridge.vmx
          grep -F "Join-Path \$repoRoot 'SETUP.cmd'" build/New-Release.ps1
          if grep -R -F 'Disable-NetAdapter' installer; then
            echo 'Setup/start scripts must never disable Wi-Fi.' >&2
            exit 1
          fi

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject private and runtime artifacts
        run: |
          if find . -type f \( -name 'id_ed25519*' -o -name 'admin-password.txt' -o -name 'hostkey.txt' -o -name '*.vmem' -o -name '*.vmss' -o -name '*.btsnoop' -o -name 'known_hosts' \) | grep -q .; then
            echo 'Private or runtime artifact found in repository.' >&2
            exit 1
          fi
